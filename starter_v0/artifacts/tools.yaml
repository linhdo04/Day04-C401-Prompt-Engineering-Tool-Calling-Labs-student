tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user for missing required information or explicit yes/no confirmation. For any send/post/publish/đăng/gửi/Telegram request, response_type MUST be yes_no, even if the content is vague. Use text only for non-send missing account, URL, topic, or item list."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "One concise question to unblock the request."}
        response_type: {type: string, enum: [yes_no, text, choice], default: "text", description: "Use yes_no for every send/post/publish/đăng/gửi/Telegram confirmation; use text only for non-send missing URL/account/topic/items."}
        options: {type: array, default: [], items: {type: string}, description: "Choices when response_type is choice."}
      required: [question, response_type]

  - name: timeline
    description: "Get recent tweets/posts from one specific account. Use when the user asks for tweets by a person/account. Map Sam Altman to sama, Elon Musk to elonmusk, Andrej Karpathy to karpathy. Do not use for topic searches. If the user asks for latest tweets without an account/person, use clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @, e.g. sama, elonmusk, karpathy."}
        limit: {type: integer, default: 5, description: "Number of recent posts requested; preserve explicit counts such as 10 or 3."}
      required: [screenname]

  - name: social_search
    description: "Search tweets/social posts by topic, keyword, hashtag, or public discussion. Use Top for popular/top/phổ biến results; otherwise Latest. Do not use for one user's timeline, do not call with an empty query, and do not use if the latest turn says to drop Twitter/social or switch to web/news."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or keyword to search, e.g. GPT-5, OpenAI, AI."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top for popular/top/phổ biến; Latest for recent discussion."}
        limit: {type: integer, default: 5, description: "Number of posts to return."}
      required: [query]

  - name: lookup
    description: "Search the web for science/technology research, official technical reports, model cards, benchmark claims, product/company releases, general research, or current news. Use topic=news for news/current events. Use timeframe=day for today/hôm nay, week for this week/tuần này, month for this month, year for this year."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Web search query. Include distinctive terms from the user's claim, e.g. Llama 3 405B Meta 88.6 benchmark technical report."}
        topic: {type: string, enum: [general, news], default: "general", description: "news for current events/news requests; general otherwise."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=today/hôm nay, week=tuần này/this week, month=this month, year=this year."}
        max_results: {type: integer, default: 5, description: "Number of web results."}
      required: [query]

  - name: fetch
    description: "Read a specific URL supplied by the user or found in earlier tool results. Use when an exact link must be quoted, verified, or summarized. If the user says this article/bài này without a URL or prior matching lookup result, use clarify instead."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Exact URL from the user's request."}
      required: [url]

  - name: format
    description: "Format already collected items into markdown. This tool does not fetch, search, verify, or create new facts. Use only when items are already available."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Existing items from prior tool results."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output template."}
        headline: {type: string, default: "", description: "Digest headline."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Send text to the configured Telegram channel. This is the only real send action and has side effects. Call only after the latest user turn explicitly confirms sending the exact text; otherwise use clarify with response_type=yes_no or telegram_preview for preview-only requests."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Exact text to send."}
        confirmed: {type: boolean, default: false, description: "Must be true only after explicit latest-turn user confirmation."}
      required: [text]

  - name: policy
    description: "Search local company policy markdown. Use for internal policy, source/citation, data privacy, tool usage, AI research workflow, or external publishing questions. This does not search the web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy question or keywords."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Best matching policy area."}
        top_k: {type: integer, default: 3, description: "Number of policy sections."}
      required: [query]

  - name: papers
    description: "Search arXiv for academic papers/preprints by topic. Use when the user explicitly asks for arXiv/preprints or academic paper discovery by topic; do not use as the default for named company models, benchmark claims, model cards, or technical reports. If the user says this year/năm nay, pass the current year in year. If they ask for recent/gần đây, use sort_by=lastUpdatedDate or submittedDate."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query. Must include the requested research topic; do not leave empty unless the user explicitly asks for all arXiv papers."}
        max_results: {type: integer, default: 5, description: "Number of papers."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort mode."}
        year: {type: integer, description: "Publication/submission year filter, e.g. 2026 for this year/năm nay."}
        published_after: {type: string, description: "Optional inclusive lower bound for arXiv submitted date in YYYY-MM-DD format."}
        published_before: {type: string, description: "Optional inclusive upper bound for arXiv submitted date in YYYY-MM-DD format."}
      required: [query]

  - name: paper_text
    description: "Download/read text from a specific arXiv paper ID or URL. Use when the user provides an arXiv ID/URL and asks to read/extract pages."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL, e.g. 1706.03762."}
        max_pages: {type: integer, default: 5, description: "Maximum pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum characters returned."}
      required: [arxiv_url]

  # ---------------- Team-added tools ----------------
  - name: research_digest
    description: "Create a concise cited research brief from already collected items. This local tool does not fetch live data, verify facts, or create new evidence; use lookup/social_search/fetch first when fresh evidence is needed."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Existing evidence items with title, summary, url, and source."
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              url: {type: string}
              source: {type: string}
        headline: {type: string, default: "Research brief", description: "Brief title."}
        audience: {type: string, default: "general", description: "Audience, e.g. executives, engineers, general."}
        max_items: {type: integer, default: 5, description: "Maximum items to include."}
      required: [items]

  - name: source_quality
    description: "Assess source diversity, URL presence, and citation readiness for already collected items. This local analyzer does not fetch or verify facts, and should not replace lookup/fetch for fresh research."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Existing evidence items to check."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        min_sources: {type: integer, default: 2, description: "Minimum distinct sources expected."}
        require_urls: {type: boolean, default: true, description: "Whether each item must include a URL."}
      required: [items]

  - name: trend_compare
    description: "Compare already collected web/news items and social items for one topic. Use when the user says web_items/social_items, already collected, provided items, existing items, or đã có. This local analyzer does not fetch live data; do not call lookup or social_search for the same comparison when items were supplied in current or earlier turns."
    parameters:
      type: object
      properties:
        web_items:
          type: array
          default: []
          description: "Items from web/news lookup or fetch."
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              source: {type: string}
              url: {type: string}
        social_items:
          type: array
          default: []
          description: "Items from social search or timeline."
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              source: {type: string}
              url: {type: string}
        topic: {type: string, default: "", description: "Topic being compared."}
        top_k: {type: integer, default: 5, description: "Maximum themes/items to report."}
      required: [web_items, social_items]

  - name: telegram_preview
    description: "Prepare Telegram-ready text from markdown without sending anything. Use for preview/draft/notification preparation before confirmation."
    parameters:
      type: object
      properties:
        markdown: {type: string, default: "", description: "Markdown text to adapt for Telegram."}
        title: {type: string, default: "", description: "Optional message title."}
        max_chars: {type: integer, default: 3500, description: "Maximum Telegram preview length."}
      required: [markdown]
